name: SECOM Stable Sensor Ablation
on:
  push:
    paths:
      - '.github/workflows/ablation.yml'
      - 'src/secom/ablation.py'
      - 'src/secom/stability_budget.py'
      - 'src/secom/data.py'
  workflow_dispatch:
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt && pip install -e .
      - name: Download real UCI SECOM records
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          from zipfile import ZipFile
          import shutil
          out=Path("data/raw")
          out.mkdir(parents=True,exist_ok=True)
          urlretrieve("https://archive.ics.uci.edu/static/public/179/secom.zip","/tmp/secom.zip")
          with ZipFile("/tmp/secom.zip") as z:
              for entry in z.namelist():
                  name=Path(entry).name
                  if name in ("secom.data","secom_labels.data"):
                      with z.open(entry) as source,(out/name).open("wb") as target:
                          shutil.copyfileobj(source,target)
          PY
      - name: Paired filtering ablation
        run: python -m secom.ablation --data-dir data/raw --output-dir results_ablation --budget 0.25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-secom-ablation
          path: results_ablation/
