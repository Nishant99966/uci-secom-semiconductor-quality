name: Evaluate real UCI SECOM data
on:
  push:
    paths:
      - '.github/workflows/evaluate-real.yml'
      - 'src/**'
      - 'scripts/**'
      - 'requirements.txt'
  workflow_dispatch:
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Download the original public UCI SECOM data
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          from zipfile import ZipFile
          import shutil
          url = "https://archive.ics.uci.edu/static/public/179/secom.zip"
          path = Path("data/secom.zip")
          path.parent.mkdir(exist_ok=True, parents=True)
          urlretrieve(url, path)
          extract = Path("data/uci_extracted")
          with ZipFile(path) as z:
              z.extractall(extract)
          dest = Path("data/raw")
          dest.mkdir(parents=True, exist_ok=True)
          for filename in ("secom.data", "secom_labels.data"):
              matches = list(extract.rglob(filename))
              if len(matches) != 1:
                  raise RuntimeError(f"Expected one {filename}, found {matches}")
              shutil.copy2(matches[0], dest / filename)
              print(filename, (dest / filename).stat().st_size, "bytes")
          PY
      - name: Run real-dataset held-out evaluation
        run: |
          python -m secom.train --data-dir data/raw --output-dir results --split chronological --cv-folds 4
      - name: Evaluate recall-targeted alternatives on real data
        run: |
          python -m secom.recall_experiment --data-dir data/raw --output-dir results_recall --target-recall 0.70
      - name: Display metrics
        if: success()
        run: cat results/metrics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-uci-secom-evaluation
          path: |
            results/metrics.json
            results/test_predictions.csv
            results/confusion_matrix.png
            results/precision_recall_curve.png
            results/feature_importances.csv
            results_recall/recall_experiment_metrics.json
            results_recall/*_predictions.csv
          if-no-files-found: warn
