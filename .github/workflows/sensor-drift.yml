name: SECOM Sensor Drift Audit
on:
  push:
    paths:
      - '.github/workflows/sensor-drift.yml'
      - 'src/secom/drift.py'
      - 'src/secom/data.py'
  workflow_dispatch:
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt && pip install -e .
      - name: Fetch original UCI archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          from zipfile import ZipFile
          import shutil
          dst = Path("data/raw")
          dst.mkdir(parents=True, exist_ok=True)
          urlretrieve("https://archive.ics.uci.edu/static/public/179/secom.zip", "/tmp/secom.zip")
          with ZipFile("/tmp/secom.zip") as archive:
              for member in archive.namelist():
                  name = Path(member).name
                  if name in {"secom.data", "secom_labels.data"}:
                      with archive.open(member) as source, (dst / name).open("wb") as target:
                          shutil.copyfileobj(source, target)
          assert all((dst / x).exists() for x in ["secom.data","secom_labels.data"])
          PY
      - name: Compute drift statistics
        run: python -m secom.drift --data-dir data/raw --output-dir results_drift
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secom-drift-audit
          path: results_drift/
